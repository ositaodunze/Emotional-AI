<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="home.css">
    <style>
        /* Add spacing styles directly in HTML for now */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .topnav {
            padding: 20px 0;
            margin-bottom: 40px;
            list-style: none;
        }

        .topnav li {
            display: inline;
            margin-right: 20px;
        }

        .topnav a {
            text-decoration: none;
            padding: 10px;
        }

        .header {
            text-align: center;
            margin: 40px 0;
        }

        .content-section {
            text-align: center;
            margin: 30px 0;
        }

        #myP {
            margin: 20px 0;
            font-size: 1.2em;
        }

        #CalibrateButton {
            padding: 15px 30px;
            font-size: 1.1em;
            margin: 20px 0;
            cursor: pointer;
        }

        .camera-section {
            margin: 30px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <ul class="topnav">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <header class="header">
            <h1 id="myH1"><b>Welcome to Feed Music AI</b></h1>
        </header>

        <main>
            <section class="content-section">
                <p id="myP">Click the button below to calibrate your mood</p>
                <button id="CalibrateButton" type="button">Calibrate your Mood</button>
            </section>

            <section class="camera-section">
                <input type="file" accept="video/*" capture="camera" />
            </section>
        </main>
    </div>

    <script src="home.jsx"></script>
    <script>
        // Handle both the calibration UI update and Spotify login
        document.getElementById('CalibrateButton').addEventListener('click', function() {
            // Update button text (original functionality)
            this.innerHTML = "Calibrating...";
            
            // Redirect to Spotify login
            window.location.href = 'http://localhost:8000/login';  // Assuming your backend runs on port 8000';
        });
    </script>
</body>
</html>
